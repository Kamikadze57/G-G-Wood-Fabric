<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Каталог</title>
    <link rel="shortcut icon" href="../images/favicon.svg" type="image/x-icon"/>
    <link rel="stylesheet" href="../sass/main.scss" />
  </head>
  <body>
    <include src="partials/header.html"></include>
    <main>
      <div class="container">
        <nav class="breadcrumbs" breadcrumbs></nav>
      </div>
      <section class="catalog">
        <div class="container">
          <h1 class="catalog__title">Каталог</h1>
          <ul class="catalog__list">
            <li class="catalog__item">
              <a href="" class="catalog-item__link">

                <h2 class="catalog-item__title">Міжкімнатні двері</h2>
                <button class="catalog-item__btn">
                  <svg class="catalog-item__svg">
                    <use href="../images/icons.svg#next"></use>
                  </svg>
                </button>
              </li>
            </a>
            <li class="catalog__item">
              <a href="" class="catalog-item__link">
                <h2 class="catalog-item__title">Меблі</h2>
                <button class="catalog-item__btn">
                  <svg class="catalog-item__svg">
                    <use href="../images/icons.svg#next"></use>
                </svg>
              </button>
            </a>
            </li>
            <li class="catalog__item">
              <a href="" class="catalog-item__link">
                <h2 class="catalog-item__title">Стінові панелі "Баузери"</h2>
                <button class="catalog-item__btn">
                  <svg class="catalog-item__svg">
                    <use href="../images/icons.svg#next"></use>
                  </svg>
                </button>
              </a>
            </li>
            <li class="catalog__item">
              <a href="" class="catalog-item__link">

                <h2 class="catalog-item__title">Сходи</h2>
                <button class="catalog-item__btn">
                  <svg class="catalog-item__svg">
                    <use href="../images/icons.svg#next"></use>
                  </svg>
                </button>
              </a>
            </li>
            <li class="catalog__item">
              <a href="" class="catalog-item__link">
                <h2 class="catalog-item__title">Меблеві фасади</h2>
                <button class="catalog-item__btn">
                  <svg class="catalog-item__svg">
                    <use href="../images/icons.svg#next"></use>
                  </svg>
                </button>
              </a>
              </li>
          </ul>
        </div>
      </section>
    </main>
    <include src="partials/footer.html"></include>
    <script type="module" src="../main.js"></script>
  </body>
</html>
